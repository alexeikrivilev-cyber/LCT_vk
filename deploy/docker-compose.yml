name: lct

services:
  lct:
    container_name: lct
    image: ${LCT_IMAGE:-ghcr.io/nexu-io/od:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${LCT_ALLOWED_ORIGINS:-}
      OD_PORT: 7456
      OD_WEB_PORT: ${LCT_PORT:-7456}
      OD_API_TOKEN: ${OD_API_TOKEN:-}
      OD_DISABLE_API_AUTH: ${LCT_DISABLE_API_AUTH:-}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:${LCT_PORT:-7456}:7456"
    volumes:
      - lct_data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${LCT_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lct_data:
